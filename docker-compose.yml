version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENV=production
      - DEBUG=False
      - PORT=8001
      - DATABASE_URL=sqlite:///./marketing.db
      - LLM_PROVIDER=mock
      - SEARCH_PROVIDER=mock
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
